  FL: {weight: 1.5, metros: [Miami, Orlando, Tampa, Jacksonville, Fort Lauderdale]}
  GA: {weight: 1.5, metros: [Atlanta, Savannah, Braselton]}
  NC: {weight: 1.5, metros: [Charlotte, Mooresville, Concord, Raleigh]}
