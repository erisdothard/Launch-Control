# Launch Control lead-gen config. Max's spec (2026-10-15) translated into knobs.
# Secrets are NOT here: see .env.example.

# Goes in the crawler User-Agent so site owners can reach us. Replace the placeholder
# with a real monitored inbox before large runs.
contact_email: hello@launchcontrol.example
bot_url: https://launch-control-flame.vercel.app
out_dir: out

# Total Google Maps queries per run, split across states by weight (below).
max_queries: 200

# Fixed segment list. Labels are what the CRM shows; the scorer must pick one of them.
# Keywords become Google Maps queries: "<keyword> near <track>" / "<keyword> in <metro>".
segments:
  arrive_and_drive:
    label: Arrive & drive
    keywords: [arrive and drive racing, race car rental program]
  endurance_team:
    label: Endurance team
    keywords: [endurance racing team, champcar team, lucky dog racing team]
  race_prep:
    label: Race prep shop
    keywords: [race prep shop, race car fabrication, motorsport engineering shop]
  racing_school:
    label: Racing school
    keywords: [racing school, performance driving school]
  hpde:
    label: HPDE / track day
    keywords: [track day organizer, HPDE track day]
  driver_development:
    label: Driver development
    keywords: [driver development program racing, race driver coaching]
  club:
    label: Motorsport club
    keywords: [private motorsport country club, motorsport club]
  car_builder:
    label: Race car manufacturer
    keywords: [race car manufacturer, performance car builder]
  parts:
    label: Parts manufacturer
    keywords: [motorsport parts manufacturer, racing parts manufacturer]
  logistics:
    label: Transport & logistics
    keywords: [race car transport, race car storage, enclosed race trailer]
  sim:
    label: Sim racing
    keywords: [sim racing center, racing simulator]
  karting:
    label: Karting
    keywords: [karting club racing, outdoor kart track]
  experience:
    label: Driving experience
    keywords: [exotic car driving experience, supercar track experience]
  rental:
    label: Rental fleet
    keywords: [race car rental, track car rental]
  trackside:
    label: Trackside services
    keywords: [motorsport data acquisition, racing radios, race fuel supplier, racing tire service]
  other:
    label: Other
    keywords: []

# weight > 1 gets a bigger share of the query budget. Max: extra weight on the Southeast,
# TX, AZ, CA and the Great Lakes racing markets.
