  TN: {weight: 1.3, metros: [Nashville, Knoxville, Chattanooga]}
  VA: {weight: 1.3, metros: [Richmond, Virginia Beach, Danville]}
  TX: {weight: 1.5, metros: [Houston, Dallas, Austin, San Antonio]}
  AZ: {weight: 1.3, metros: [Phoenix, Scottsdale, Tucson]}
  CA: {weight: 1.5, metros: [Los Angeles, San Diego, San Jose, Sacramento]}
