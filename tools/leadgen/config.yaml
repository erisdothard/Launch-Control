gmaps:
  image: gosom/google-maps-scraper:v1.12.1
  platform: linux/amd64
  driver_path: /opt/ms-playwright-go/1.57.0
  depth: 1
  lang: en
  concurrency: 2
  exit_on_inactivity: 2m
  timeout_minutes: 45
  batch_size: 25

# Public static listings (team/vendor pages). Disabled by default; see discover/directories.py.
directories: []

enrich:
  max_pages: 6
  per_host_delay_s: 1.0
  timeout_s: 15
  max_bytes: 2000000
  concurrency: 8

filters:
  # More Google reviews than this = chain / national scale.
  max_review_count: 1500
  # Copyright older than (current year - stale_years) and no recent dates = stale.
  stale_years: 2
  # Case-insensitive substrings matched against business name and domain.
  blocklist:
    - porsche experience
    - bmw performance center
    - mercedes-amg
    - ferrari
    - lamborghini
    - ford performance racing school
    - k1 speed
    - andretti indoor karting
    - dave & buster
    - nascar racing experience
    - richard petty driving
    - xtreme xperience
    - exotics racing
    - autozone
    - o'reilly auto
    - advance auto parts
    - napa auto parts
    - pep boys
    - racetrac
    - raceway stores
    - racewaystores
    - carmax
    - autonation
    - enterprise rent
    - hertz
    - turo
  # Factor rating at or below which a scored lead is excluded, not just capped. On the 2026-10-17
  # run, booking_need <= 1 matched 0 of Max's 32 contacted and 8 of his 13 lost (parts stores).
  factor_floors:
    booking_need: 1
    niche_fit: 1
  # keep | drop results outside the requested states. Keep: Max contacted several nearby
  # out-of-state venues from a Florida-only run.
  out_of_state: keep
  # Keywords the Prospector paused for low yield (see leadgen/prospector.py). Remove to resume.
  paused_keywords: []
  # Google Maps categories that are never prospects.
  excluded_categories:
    - Gas station
    - Truck stop
    - Convenience store
    - Car wash
    - Hotel
    - Restaurant
    - Bar
    - Hobby store
    - Auto body shop
    - Car dealer
    - Used car dealer

score:
  model: claude-sonnet-5-5
  effort: medium
  concurrency: 4
  max_text_chars: 6000
  max_tokens: 4000
  use_fallbacks: true
  # Weighted sum of 0-5 factor ratings, normalised to 0-100.
  weights:
    high_ticket_value: 1.5
    booking_need: 1.5
    decision_maker_size: 1.0
    owner_accessible: 1.0
    recent_activity: 1.0
    niche_fit: 1.5
    repeat_potential: 1.0
    weak_backend: 1.5
    regional_expansion: 0.5
    partnership_potential: 0.5
    contact_findable: 1.0
