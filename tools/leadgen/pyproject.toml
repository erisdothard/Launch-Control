[project]
name = "leadgen"
version = "0.1.0"
description = "Launch Control lead-generation pipeline: discover, enrich, filter and score small US motorsport businesses."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.14",
    "httpx>=0.27",
    "selectolax>=1.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "phonenumbers>=8.13",
    "tldextract>=5.1",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
]

[project.scripts]
leadgen = "leadgen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["leadgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["leadgen"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]

[tool.ruff.lint.per-file-ignores]
# Long regexes and rubric prose read better unwrapped.
"leadgen/prompt.py" = ["E501"]
"leadgen/enrich/people.py" = ["E501"]
"leadgen/enrich/extract.py" = ["E501"]
"tests/*" = ["E501"]
