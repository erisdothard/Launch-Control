<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../css/fonts.css" crossorigin="anonymous">
<style>
  body{margin:0;width:1200px;height:630px;background:#f4f2ec;color:#141311;font-family:"Big Shoulders",sans-serif;display:grid;grid-template-rows:auto 1fr auto;padding:56px 64px;box-sizing:border-box;border:14px solid #141311}
  .top{display:flex;justify-content:space-between;align-items:center}
  .lockup{display:flex;align-items:center;gap:16px;font-weight:900;text-transform:uppercase;font-size:28px;line-height:.9}
  .board{display:inline-flex;gap:4px;padding:6px;background:#141311}
  .tile{display:grid;place-items:center;width:34px;height:44px;background:#f4f2ec;font-weight:900;font-size:24px}
  h1{margin:0;align-self:end;font-weight:900;text-transform:uppercase;font-size:136px;line-height:.84;letter-spacing:-.01em}
  h1 em{font-style:normal;color:#e4572e}
  .foot{font-family:"JetBrains Mono",monospace;font-size:18px;text-transform:uppercase;letter-spacing:.1em;color:#8d887f;display:flex;justify-content:space-between}
</style></head><body>
<div class="top"><div class="lockup"><img src="mark.svg" width="56" height="56"><span>Launch<br>Control</span></div><div class="board"><span class="tile">P</span><span class="tile">I</span><span class="tile">T</span><span class="tile">&nbsp;</span><span class="tile">W</span><span class="tile">A</span><span class="tile">L</span><span class="tile">L</span></div></div>
<h1>You've got the car.<br><em>We're the pit wall.</em></h1>
<div class="foot"><span>Business development, built and run</span><span>launchcontrol.co</span></div>
</body></html>
